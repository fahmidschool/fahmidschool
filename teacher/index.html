<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Portal — Fahmid School</title>

  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" type="module"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/utilities.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>

<div class="mobile-overlay" id="mobile-overlay"></div>

<div class="app-shell">
  <div id="sidebar-container"></div>
  <div class="main-content" id="main-content">
    <div id="topbar-container"></div>
    <div id="page-outlet"></div>
  </div>
</div>

<script type="module">
  import { authService }  from '/js/auth.js';
  import { buildSidebar } from '/js/components/sidebar.js';
  import { buildTopbar }  from '/js/components/topbar.js';
  import { router }       from '/js/router.js';

  authService.onAuthChange(({ user, profile }) => {
    if (!user || profile?.role !== 'teacher') {
      window.location.href = '/index.html';
    }
  });

  const NAV = [
    {
      label: 'Overview',
      items: [
        { route: '/dashboard',   label: 'Dashboard',   icon: 'ph-squares-four' },
        { route: '/announcements', label: 'Announcements', icon: 'ph-megaphone' },
      ]
    },
    {
      label: 'Teaching',
      items: [
        { route: '/results',     label: 'Results Entry', icon: 'ph-medal' },
        { route: '/attendance',  label: 'Attendance',    icon: 'ph-user-check' },
        { route: '/lessons',     label: 'Lesson Notes',  icon: 'ph-book-open' },
        { route: '/assignments', label: 'Assignments',   icon: 'ph-clipboard-text' },
      ]
    },
  ];

  buildSidebar({ containerId: 'sidebar-container', navItems: NAV, role: 'Teacher' });
  buildTopbar({ containerId: 'topbar-container' });

  router.defineOutlet('#page-outlet');
  router.register('/dashboard',    () => import('/js/modules/teacher/dashboard.js'));
  router.register('/results',      () => import('/js/modules/teacher/results.js'));
  router.register('/attendance',   () => import('/js/modules/teacher/attendance.js'));
  router.register('/lessons',      () => import('/js/modules/teacher/lessons.js'));
  router.register('/assignments',  () => import('/js/modules/teacher/assignments.js'));
  router.register('/announcements',() => import('/js/modules/admin/announcements.js'));

  if (!window.location.hash || window.location.hash === '#') window.location.hash = '/dashboard';
  router.init();
</script>

</body>
</html>
